[project]
name = "x-automation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "twitter-text-parser==3.0.0",
]

[dependency-groups]
dev = ["ruff>=0.16,<0.17"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["xr/vendor"]  # third-party (fa_lint, MIT), kept byte-identical to upstream
